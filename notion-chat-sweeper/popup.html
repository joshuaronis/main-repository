<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    width: 232px; margin: 0; padding: 12px;
    background: #1f1f1f; color: #e8e8e8;
    font: 12px system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 12px; font-weight: 600; margin: 0 0 2px; }
  #sub { color: #9a9a9a; font-size: 11px; margin-bottom: 10px; }
  button {
    display: block; width: 100%; margin-bottom: 6px;
    background: #2a2a2a; color: #e8e8e8;
    border: 1px solid #3a3a3a; border-radius: 5px;
    padding: 6px 8px; font: inherit; cursor: pointer;
  }
  button:hover { background: #343434; }
  button:disabled { opacity: .45; cursor: default; }
  #run { color: #9a9a9a; font-size: 11px; margin: 8px 0 0; line-height: 1.45; }
  #tip { color: #7a7a7a; font-size: 10px; margin-top: 8px; line-height: 1.45;
         border-top: 1px solid #3a3a3a; padding-top: 8px; }
  kbd { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 3px;
        padding: 0 3px; font: inherit; }
</style>
</head>
<body>
  <h1>Notion Chat Sweeper</h1>
  <div id="sub">checking…</div>

  <button id="open">Open panel</button>
  <button id="broom">Hide broom</button>

  <div id="run"></div>
  <div id="tip">
    The panel always opens with <kbd>⌘⇧K</kbd> or the button above — even when
    the broom is hidden, so it can't get lost.
  </div>

  <script src="popup.js"></script>
</body>
</html>
